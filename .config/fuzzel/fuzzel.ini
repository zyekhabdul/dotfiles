[main]
font=JetBrainsMono Nerd Font:size=14
dpi-aware=auto
prompt="run: "
icons-enabled=yes
fields=name,generic,comment,exec
match-mode=fzf
lines=10
width=35
horizontal-pad=24
vertical-pad=16
inner-pad=8
anchor=center

[colors]
background=0a0a0af0
text=888888ff
prompt=55ffffff
placeholder=777777ff
input=ffffffff
match=55ffffff
selection=1f1f1fff
selection-text=ffffffff
selection-match=55ffffff
border=3b3b3bff

[border]
width=1
radius=8
