# ==============================================================================
# 1. PENGATURAN UMUM & KEYBINDINGS (Opsional tapi Sangat Direkomendasikan)
# ==============================================================================

# Ubah prefix bawaan dari Ctrl+b ke Ctrl+a (lebih ergonomis, mirip screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Aktifkan fitur Mouse (bisa klik panel, scroll, dan resize pakai mouse)
set -g mouse on

# Mulai penomoran window dan pane dari angka 1 (bukan 0, agar pas dengan keyboard)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Shortcut cepat untuk reload konfigurasi ini (Prefix + r)
bind r source-file ~/.tmux.conf \; display-message "Konfigurasi Berhasil Dimuat Ulang!"


# ==============================================================================
# 2. DAFTAR PLUGIN ESENSIAL UNTUK DEVELOPER
# ==============================================================================

# Manajer plugin wajib
set -g @plugin 'tmux-plugins/tpm'

# Memberikan pengaturan default yang aman dan esensial
set -g @plugin 'tmux-plugins/tmux-sensible'

# INTEGRASI VIM/NEOVIM: Navigasi panel Tmux dan Vim tanpa konflik menggunakan Ctrl+h/j/k/l
set -g @plugin 'christoomey/vim-tmux-navigator'

# CLIPBOARD INTERACTION: Copy teks di Tmux langsung masuk ke clipboard OS utama Anda
set -g @plugin 'tmux-plugins/tmux-yank'

# SESSION PERSISTENCE: Menyimpan sesi kerja (layout, panel, direktori) agar tidak hilang saat PC mati
set -g @plugin 'tmux-plugins/tmux-resurrect'

# AUTOMATION BACKUP: Otomatis menyimpan sesi setiap 15 menit bersama tmux-resurrect
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @automating-tmux-continuum 'on' # Aktifkan auto-save otomatis
set -g @continuum-restore 'on'          # Otomatis restore sesi terakhir saat Tmux dibuka

# TEMA VISUAL: Membuat tampilan status bar menjadi modern dan estetik (Tema Catppuccin)
# set -g @plugin 'catppuccin/tmux'
# set -g @catppuccin_flavor 'mocha' # Pilihan visual: latte, frappe, macchiato, mocha

# ==============================================================================
# TAMPILAN STATUS BAR MONOCHROME (TRANSPARAN / HITAM-PUTIH MINIMALIS)
# ==============================================================================

# Aktifkan warna 256 agar gradasi abu-abu terbaca sempurna
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# 1. Warna Dasar Status Bar (Latar transparan mengikuti terminal, teks abu-abu terang)
set -g status-style bg=default,fg=#b2b2b2

# 2. Format Bagian Kiri (Nama Sesi) - Teks putih tebal dengan background abu-abu gelap
set -g status-left "#[fg=#ffffff,bg=#262626,bold] #S #[bg=default,fg=default] "

# 3. Format Bagian Kanan (Jam & Tanggal) - Monochrome simpel
set -g status-right "#[fg=#8a8a8a] %Y-%m-%d │ %H:%M "

# 4. Pengaturan Tab/Window yang Sedang Tidak Aktif (Abu-abu redup)
set -g window-status-style fg=#666666,bg=default
set -g window-status-format " #I:#W "

# 5. Pengaturan Tab/Window yang Sedang Aktif (Teks putih terang dan tebal)
set -g window-status-current-style fg=#ffffff,bg=default,bold
set -g window-status-current-format " #[fg=#ffffff]• #I:#W "

# 6. Warna Garis Pembatas Panel Terminal (Bukan hijau lagi, tapi abu-abu gelap)
set -g pane-border-style fg=#262626
set -g pane-active-border-style fg=#8a8a8a # Garis panel yang sedang aktif


# ==============================================================================
# 3. INISIALISASI TPM (HARUS DI BARIS PALING BAWAH)
# ==============================================================================
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
run '~/.config/tmux/plugins/tpm/tpm'

# Mencegah duplikasi window saat auto-restore berjalan (dinonaktifkan agar tidak kill session kosong)
# set -g @resurrect-hook-post-restore-all 'tmux kill-window -t :1'


